<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>晨间诗笺 · Morning Verses</title>

  <!-- Google Fonts: Noto Serif SC for poetic Chinese typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;700&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       CSS Reset & Base — 极度留白，让文字呼吸
       ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100vh;
      background: #faf8f5;              /* 暖白底，像晨光中的纸 */
      font-family: 'Noto Serif SC', 'Source Han Serif SC', 'SimSun', serif;
      color: #2c2c2c;
      overflow-x: hidden;
    }

    /* ---- Canvas 背景层 ---- */
    #bg-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;              /* 让鼠标穿透，不干扰交互 */
    }

    /* ---- 主内容层 ---- */
    main {
      position: relative;
      z-index: 1;
      max-width: 680px;
      margin: 0 auto;
      padding: 60px 24px 40px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ============================================================
       顶部区域：日期 + 复制按钮
       ============================================================ */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 48px;
    }

    .date-display {
      font-size: 0.95rem;
      font-weight: 300;
      color: #8a857c;
      letter-spacing: 0.05em;
    }

    .copy-btn {
      background: none;
      border: 1px solid #d4cfc7;
      color: #8a857c;
      font-family: inherit;
      font-size: 0.8rem;
      padding: 6px 16px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.25s ease;
      font-weight: 300;
    }
    .copy-btn:hover {
      background: #ece7de;
      border-color: #b0a99d;
      color: #4a4540;
    }

    /* ============================================================
       诗歌正文区域
       ============================================================ */
    .poem-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .poem-title {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 32px;
      color: #1a1a1a;
      letter-spacing: 0.03em;
    }

    .poem-body {
      line-height: 2.2;
      font-size: 1.05rem;
      font-weight: 300;
      color: #3a3632;
    }
    .poem-body p {
      margin-bottom: 4px;
    }

    /* ============================================================
       诗析板块
       ============================================================ */
    .analysis {
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid #e8e2d6;
      font-size: 0.85rem;
      line-height: 1.9;
      color: #99948a;
      font-weight: 300;
    }

    /* ============================================================
       底部翻阅区
       ============================================================ */
    .nav-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
      margin-top: 56px;
      padding-top: 24px;
      border-top: 1px solid #f0ebe0;
    }

    .nav-btn {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 0.85rem;
      color: #b0a99d;
      cursor: pointer;
      padding: 4px 12px;
      transition: color 0.25s ease;
      font-weight: 300;
    }
    .nav-btn:hover { color: #4a4540; }
    .nav-btn.today {
      color: #4a4540;
      font-weight: 400;
      border-bottom: 1px solid #c4bdb0;
    }
    .nav-btn:disabled {
      color: #ddd8ce;
      cursor: default;
    }

    /* ============================================================
       Toast 提示
       ============================================================ */
    .toast {
      position: fixed;
      top: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(-120px);
      background: #3a3632;
      color: #faf8f5;
      padding: 10px 28px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-family: inherit;
      z-index: 100;
      opacity: 0;
      transition: transform 0.35s cubic-bezier(0.22, 0.61, 0.36, 1),
                  opacity 0.35s ease;
      pointer-events: none;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* ============================================================
       淡入淡出动画
       ============================================================ */
    .fade-enter {
      animation: fadeIn 0.45s ease both;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0);   }
    }

    /* ============================================================
       加载 & 空状态
       ============================================================ */
    .empty-state {
      text-align: center;
      color: #c4bdb0;
      font-size: 0.9rem;
      margin-top: 80px;
    }

    /* ============================================================
       响应式：移动端
       ============================================================ */
    @media (max-width: 520px) {
      main { padding: 40px 18px 32px; }
      .top-bar { margin-bottom: 32px; }
      .poem-title { font-size: 1.15rem; margin-bottom: 24px; }
      .poem-body { font-size: 0.95rem; line-height: 2.0; }
      .analysis { margin-top: 36px; font-size: 0.78rem; }
      .nav-bar { gap: 14px; margin-top: 40px; }
      .nav-btn { font-size: 0.78rem; padding: 4px 8px; }
    }
  </style>
</head>
<body>

  <!-- Canvas 动态背景 -->
  <canvas id="bg-canvas"></canvas>

  <!-- Toast -->
  <div class="toast" id="toast">已复制</div>

  <!-- 主内容 -->
  <main>
    <div class="top-bar">
      <span class="date-display" id="date-display"></span>
      <button class="copy-btn" id="copy-btn" title="复制诗歌正文">复制</button>
    </div>

    <div class="poem-section" id="poem-section">
      <!-- 动态填充 -->
    </div>

    <div class="nav-bar" id="nav-bar">
      <!-- 动态填充 -->
    </div>
  </main>

  <script>
    /* ============================================================
       Canvas 背景 — 缓慢呼吸的浮游粒子
       使用 requestAnimationFrame，低透明度，性能优先
       ============================================================ */
    (function bgCanvas() {
      var canvas = document.getElementById('bg-canvas');
      var ctx = canvas.getContext('2d');
      var particles = [];
      var PARTICLE_COUNT = 55;          // 粒子数量，兼顾性能与美感
      var mouse = { x: -1000, y: -1000 }; // 鼠标位置，初始远离画面

      // ---- 响应尺寸 ----
      function resize() {
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      // 鼠标靠近时粒子微动，增加生气
      window.addEventListener('mousemove', function(e) {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
      });

      // ---- 初始化粒子 ----
      for (var i = 0; i < PARTICLE_COUNT; i++) {
        particles.push({
          x:  Math.random() * canvas.width,
          y:  Math.random() * canvas.height,
          r:  Math.random() * 1.8 + 0.4,        // 半径 0.4–2.2px
          vx: (Math.random() - 0.5) * 0.15,     // 水平漂移速度
          vy: (Math.random() - 0.5) * 0.15,     // 垂直漂移速度
          baseAlpha: Math.random() * 0.35 + 0.05 // 基础透明度 5%–40%
        });
      }

      // ---- 绘制循环 ----
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        var now = Date.now() * 0.001;           // 秒级时间戳，用于呼吸周期

        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];

          // 更新位置
          p.x += p.vx;
          p.y += p.vy;

          // 边界环绕（穿出画面从对侧进入）
          if (p.x < -5) p.x = canvas.width + 5;
          if (p.x > canvas.width + 5) p.x = -5;
          if (p.y < -5) p.y = canvas.height + 5;
          if (p.y > canvas.height + 5) p.y = -5;

          // 鼠标附近的粒子稍亮（距离 < 200px 时）
          var dx = p.x - mouse.x;
          var dy = p.y - mouse.y;
          var dist = Math.sqrt(dx * dx + dy * dy);
          var glow = dist < 200 ? (1 - dist / 200) * 0.25 : 0;

          // 呼吸效果：用正弦波让透明度周期性变化
          var breath = Math.sin(now * 0.6 + i * 0.7) * 0.15;
          var alpha = Math.min(0.55, p.baseAlpha + breath + glow);

          // 绘制粒子
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(140,130,115,' + alpha.toFixed(3) + ')';
          ctx.fill();
        }

        requestAnimationFrame(draw);
      }

      draw();
    })();


    /* ============================================================
       数据 & 交互逻辑
       ============================================================ */
    (function app() {
      var poems = [];                    // 全部诗歌数据
      var currentIndex = -1;            // 当前展示的诗歌索引 (-1 表示未选中)
      var todayIndex = -1;              // 今日诗歌在数组中的索引

      // DOM 引用
      var dateDisplay  = document.getElementById('date-display');
      var poemSection  = document.getElementById('poem-section');
      var navBar       = document.getElementById('nav-bar');
      var copyBtn      = document.getElementById('copy-btn');
      var toast        = document.getElementById('toast');

      // ---- 工具函数：格式化日期 ----
      function formatDate(dateStr) {
        // dateStr 格式: "2026-07-17" → "2026.07.17 晨"
        var parts = dateStr.split('-');
        return parts[0] + '.' + parts[1] + '.' + parts[2] + ' 晨';
      }

      function shortDate(dateStr) {
        // "2026-07-17" → "7.17"
        var parts = dateStr.split('-');
        return parseInt(parts[1], 10) + '.' + parseInt(parts[2], 10);
      }

      function getTodayStr() {
        var d = new Date();
        var y = d.getFullYear();
        var m = String(d.getMonth() + 1).padStart(2, '0');
        var day = String(d.getDate()).padStart(2, '0');
        return y + '-' + m + '-' + day;
      }

      // ---- 查找今日诗歌索引 ----
      function findTodayIndex() {
        var today = getTodayStr();
        for (var i = 0; i < poems.length; i++) {
          if (poems[i].date === today) return i;
        }
        return -1;                       // 今日尚无诗歌
      }

      // ---- 渲染诗歌 ----
      function renderPoem(index) {
        if (index < 0 || index >= poems.length) {
          poemSection.innerHTML = '<div class="empty-state">暂无诗笺</div>';
          dateDisplay.textContent = formatDate(getTodayStr());
          copyBtn.style.display = 'none';
          return;
        }

        copyBtn.style.display = '';
        var poem = poems[index];

        // 日期
        dateDisplay.textContent = formatDate(poem.date);

        // 诗歌正文
        var linesHtml = poem.content
          .map(function(line) { return '<p>' + escapeHtml(line) + '</p>'; })
          .join('');

        var html = '<h2 class="poem-title fade-enter">' + escapeHtml(poem.title) + '</h2>';
        html += '<div class="poem-body fade-enter">' + linesHtml + '</div>';
        if (poem.analysis) {
          html += '<div class="analysis fade-enter">' + escapeHtml(poem.analysis) + '</div>';
        }
        poemSection.innerHTML = html;

        currentIndex = index;
        renderNav();
      }

      function escapeHtml(str) {
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(str));
        return div.innerHTML;
      }

      // ---- 底部翻页导航 ----
      function renderNav() {
        if (poems.length === 0) {
          navBar.innerHTML = '';
          return;
        }

        var prevIndex = currentIndex - 1;
        var nextIndex = currentIndex + 1;

        var prevLabel = prevIndex >= 0 ? shortDate(poems[prevIndex].date) : '';
        var nextLabel = nextIndex < poems.length ? shortDate(poems[nextIndex].date) : '';

        var html = '';

        // "< 7.16" 按钮
        html += '<button class="nav-btn" onclick="navigateTo(' + prevIndex + ')"';
        if (prevIndex < 0) html += ' disabled';
        html += '>&lt; ' + prevLabel + '</button>';

        // "Today" 按钮
        html += '<button class="nav-btn';
        if (currentIndex === todayIndex) html += ' today';
        html += '" onclick="navigateTo(' + todayIndex + ')"';
        if (todayIndex < 0) html += ' disabled';
        html += '>Today</button>';

        // "7.18 >" 按钮
        html += '<button class="nav-btn" onclick="navigateTo(' + nextIndex + ')"';
        if (nextIndex >= poems.length) html += ' disabled';
        html += '>' + nextLabel + ' &gt;</button>';

        navBar.innerHTML = html;
      }

      // ---- 导航跳转 ----
      window.navigateTo = function(index) {
        if (index < 0 || index >= poems.length) return;
        // 触发淡入动画：先清空再渲染
        poemSection.innerHTML = '';
        requestAnimationFrame(function() {
          renderPoem(index);
        });
      };

      // ---- 复制功能 ----
      copyBtn.addEventListener('click', function() {
        if (currentIndex < 0) return;
        var poem = poems[currentIndex];
        var text = poem.title + '\n\n' + poem.content.join('\n');

        // 使用 Clipboard API
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function() {
            showToast();
          }).catch(function() {
            fallbackCopy(text);
          });
        } else {
          fallbackCopy(text);
        }
      });

      // 降级复制方案（兼容旧浏览器）
      function fallbackCopy(text) {
        var textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try { document.execCommand('copy'); showToast(); } catch (e) {}
        document.body.removeChild(textarea);
      }

      function showToast() {
        toast.classList.add('show');
        clearTimeout(toast._timeout);
        toast._timeout = setTimeout(function() {
          toast.classList.remove('show');
        }, 1800);
      }

      // ---- 加载 poems.json ----
      function loadPoems() {
        fetch('./poems.json')
          .then(function(response) {
            if (!response.ok) throw new Error('HTTP ' + response.status);
            return response.json();
          })
          .then(function(data) {
            poems = data.poems || [];
            todayIndex = findTodayIndex();

            // 默认展示今日诗歌；若无，展示最新一首；若数组为空，显示空状态
            if (todayIndex >= 0) {
              renderPoem(todayIndex);
            } else if (poems.length > 0) {
              renderPoem(0);
            } else {
              poemSection.innerHTML = '<div class="empty-state">晨间诗笺 · 静候第一首诗</div>';
              dateDisplay.textContent = formatDate(getTodayStr());
              navBar.innerHTML = '';
              copyBtn.style.display = 'none';
            }
          })
          .catch(function(err) {
            console.error('加载 poems.json 失败:', err);
            poemSection.innerHTML = '<div class="empty-state">诗笺尚未就绪，请稍后再来</div>';
            dateDisplay.textContent = formatDate(getTodayStr());
            navBar.innerHTML = '';
            copyBtn.style.display = 'none';
          });
      }

      // ---- 启动 ----
      loadPoems();
    })();
  </script>
</body>
</html>
